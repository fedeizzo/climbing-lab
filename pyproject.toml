[tool.poetry]
name = "tindeq-exporter"
version = "0.1.0"
description = "Import and analyze Tindeq finger training data"
authors = ["Federico Izzo <hi@fedeizzo.dev>"]
readme = "README.md"
packages = [
  { include = "tindeq_exporter" }
]

[tool.poetry.scripts]
tindeq = "tindeq_exporter.cli:main"

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.0.0"
pyarrow = ">=14.0.0"
numpy = ">=1.16.6"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
ipython = "^8.0.0"
jupyter = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = ["E", "F", "W", "Q", "I"]
extend-select = ["E501"]
